services:
  backend:
    build: .
    container_name: mern_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/simple_mern_db
    depends_on:
      - mongo
    networks:
      - mern_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mern_frontend
    restart: always
    ports:
      - "8083:80"
    depends_on:
      - backend
    networks:
      - mern_network

  mongo:
    image: mongo:7
    container_name: mern_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mern_mongo_data:/data/db
    networks:
      - mern_network

volumes:
  mern_mongo_data:

networks:
  mern_network:
    driver: bridge